# ============================================================
#  放射医学技术副高题库 · Nginx 反向代理配置
#  用途: HTTPS 终结 + 反向代理 Flask 后端 + 静态文件缓存
#
#  使用方法:
#    1. 将此文件复制到 nginx 配置目录:
#       Linux:   /etc/nginx/conf.d/fsgf_quiz.conf
#       Windows: C:\nginx\conf\conf.d\fsgf_quiz.conf
#    2. 在 nginx.conf 的 http {} 块内添加:
#       include conf.d/fsgf_quiz.conf;
#    3. 修改下方 server_name 为你的域名或 IP
#    4. 先用 HTTP 配置测试，确认可用后再启用 HTTPS 段
# ============================================================

# ── 全局上游定义 ──
upstream fsgf_backend {
    server 127.0.0.1:5000;
    # 多实例负载均衡时取消注释下面几行
    # server 127.0.0.1:5001;
    # server 127.0.0.1:5002;
    keepalive 32;
}

# ── 速率限制区域 ──
# 登录接口: 每 IP 每秒最多 3 次请求
limit_req_zone $binary_remote_addr zone=fsgf_login_limit:10m rate=3r/s;
# 普通 API: 每 IP 每秒最多 15 次请求
limit_req_zone $binary_remote_addr zone=fsgf_api_limit:10m rate=15r/s;

# ============================================================
#  HTTP → HTTPS 自动跳转（正式环境必须启用）
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;  # ← 改成你的域名或服务器IP

    # Let's Encrypt 验证专用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # 其他全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
#  HTTPS 主站点
# ============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;  # ← 改成你的域名或服务器IP

    # ── SSL 证书路径 ──
    ssl_certificate     /etc/nginx/ssl/fsgf_quiz.crt;      # ← 证书文件路径
    ssl_certificate_key /etc/nginx/ssl/fsgf_quiz.key;      # ← 私钥文件路径

    # ── SSL 安全配置 (推荐配置, Mozilla Intermediate) ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling (需要证书支持)
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/fsgf_ca.crt;    # CA 证书链(如有)
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # SSL Session 缓存
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── 安全头 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 隐藏 Nginx 版本号
    server_tokens off;

    # ── 访问日志 ──
    access_log /var/log/nginx/fsgf_quiz_access.log;
    error_log  /var/log/nginx/fsgf_quiz_error.log;

    # ── 客户端请求大小限制 ──
    client_max_body_size 10m;

    # ── 根路径: 前端静态文件 ──
    location / {
        root /opt/fsgf-quiz;                    # ← 改成前端文件的实际目录
        index index.html;
        try_files $uri $uri/ /index.html;       # SPA 路由回退

        # 静态资源长期缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # HTML 不缓存
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ── API 反向代理到 Flask 后端 ──
    location /api/ {
        limit_req zone=fsgf_api_limit burst=20 nodelay;

        proxy_pass http://fsgf_backend;
        proxy_redirect off;

        # ── WebSocket 支持(如将来需要) ──
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";

        # ── 标准反向代理头 ──
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # ── 超时设置 ──
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;

        # ── 响应缓冲 ──
        proxy_buffering on;
        proxy_buffer_size   4k;
        proxy_buffers       8 4k;
    }

    # ── 登录接口: 更严格的速率限制 ──
    location ~ ^/api/auth/(login|password) {
        limit_req zone=fsgf_login_limit burst=5 nodelay;

        proxy_pass http://fsgf_backend;
        proxy_redirect off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    15s;
    }

    # ── 禁止访问敏感路径 ──
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(py|db|sql|log|bak|cfg|env|ini|conf)$ {
        deny all;
        return 404;
    }

    # ── 健康检查端点 ──
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

# ============================================================
