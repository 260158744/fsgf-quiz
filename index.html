<!-- Service Worker 注册 -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js')
      .then(function(reg) {
        console.log('[App] SW registered:', reg.scope);
        // 更新检测：发现新版本时提示用户刷新
        reg.addEventListener('updatefound', function() {
          var newWorker = reg.installing;
          newWorker.addEventListener('statechange', function() {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              console.log('[App] New SW available');
              // 显示更新提示
              var el = document.getElementById('netStatus');
              el.className = 'net-status online show';
              el.querySelector('span').innerHTML = '🔄 新版本已就绪，<a href="javascript:location.reload()" style="color:#fff;text-decoration:underline">点击刷新</a>';
              el.hidden = false;
              // 立即激活新SW
              newWorker.postMessage({ action: 'skipWaiting' });
            }
          });
        });
      })
      .catch(function(err) {
        console.log('[App] SW registration failed:', err);
      });
  });
}

// 网络状态检测
function updateNetStatus() {
  var el = document.getElementById('netStatus');
  if (!navigator.onLine) {
    el.hidden = false;
    el.className = 'net-status offline show';
    setTimeout(function() { el.className = 'net-status offline'; }, 3000);
  } else {
    el.hidden = true;
  }
}
window.addEventListener('online', function() {
  var el = document.getElementById('netStatus');
  el.className = 'net-status online show';
  el.querySelector('span').textContent = '网络已恢复';
  el.hidden = false;
  setTimeout(function() { el.hidden = true; }, 2000);
});
window.addEventListener('offline', updateNetStatus);
document.addEventListener('DOMContentLoaded', updateNetStatus);

// ★ 全局错误可视化（排查时有用）
window.addEventListener('error', function(e) {
  if (e.target && e.target.tagName === 'SCRIPT') {
    console.error('Script load error:', e.target.src);
  }
});
</script>
