<!-- Service Worker 注册 -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js')
      .then(function(reg) {
        console.log('[App] SW registered:', reg.scope);
        // 更新检测：发现新版本时静默激活，并在接管后自动刷新一次以加载最新页面。
        // （不再弹出任何横幅/遮罩，避免遮挡界面）
        var _pendingReload = false;
        reg.addEventListener('updatefound', function() {
          var newWorker = reg.installing;
          newWorker.addEventListener('statechange', function() {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              console.log('[App] New SW available, activating silently');
              _pendingReload = true;
              newWorker.postMessage({ action: 'skipWaiting' });
            }
          });
        });
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (_pendingReload) { _pendingReload = false; console.log('[App] New SW controlling, reloading for latest'); location.reload(); }
        });
      })
      .catch(function(err) {
        console.log('[App] SW registration failed:', err);
      });
  });
}

// ★ 全局错误可视化（排查时有用）
window.addEventListener('error', function(e) {
  if (e.target && e.target.tagName === 'SCRIPT') {
    console.error('Script load error:', e.target.src);
  }
});
</script>

<script>
/* PWA 安装引导：捕获 beforeinstallprompt，用户点「安装」触发原生添加流程 */
(function(){
  var deferredPrompt=null;
  var banner=document.getElementById('installBanner');
  var btn=document.getElementById('installBtn');
  var close=document.getElementById('installClose');
  function canShow(){try{return !window.matchMedia('(display-mode: standalone)').matches && !sessionStorage.getItem('installDismissed')}catch(e){return false}}
  function show(){if(canShow()&&deferredPrompt&&banner){banner.hidden=false}}
  function hide(){if(banner)banner.hidden=true}
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;show();});
  window.addEventListener('appinstalled',function(){hide();try{sessionStorage.setItem('installDismissed','1')}catch(e){}});
  if(btn)btn.addEventListener('click',function(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(function(){deferredPrompt=null;hide();});});
  if(close)close.addEventListener('click',function(){hide();try{sessionStorage.setItem('installDismissed','1')}catch(e){}});
  window.addEventListener('load',function(){setTimeout(show,1500)});
})();
</script>
